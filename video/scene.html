<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Assistant;font-weight:800;src:url(Assistant-800.ttf)}
@font-face{font-family:Assistant;font-weight:400;src:url(Assistant-400.ttf)}
:root{--brown:#8C6249;--green:#2D4739;--ivory:#FDFBF7}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ivory)}
body{font-family:Assistant,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;contain:paint}
.blob{position:absolute;border-radius:50%;background:var(--brown);opacity:.08}
#ring{position:absolute;left:190px;top:200px}
#num{position:absolute;top:290px;width:100%;text-align:center;font-weight:800;font-size:380px;line-height:1;color:var(--brown)}
.line{position:absolute;width:100%;text-align:center;font-weight:800;color:var(--green);line-height:1.15}
#l1{top:860px;font-size:150px}
#l2{top:1045px;font-size:116px}
#l3{top:1210px;font-size:150px;color:var(--brown)}
#bar{position:absolute;top:1420px;left:340px;width:400px;height:10px;border-radius:5px;background:var(--green)}
#brand{position:absolute;bottom:150px;width:100%;text-align:center;font-weight:400;font-size:44px;letter-spacing:2px;color:var(--green);opacity:.7}
</style></head><body>
<div id="stage">
<div class="blob" style="width:900px;height:900px;left:-300px;top:-250px"></div>
<div class="blob" style="width:700px;height:700px;right:-250px;bottom:-200px;background:var(--green);opacity:.07"></div>
<svg id="ring" width="700" height="700" viewBox="0 0 700 700">
  <circle cx="350" cy="350" r="320" fill="none" stroke="#2D4739" stroke-opacity=".12" stroke-width="14"/>
  <circle id="arc" cx="350" cy="350" r="320" fill="none" stroke="#8C6249" stroke-width="14" stroke-linecap="round" transform="rotate(-90 350 350)"/>
</svg>
<div id="num">5</div>
<div class="line" id="l1">הרגלים</div>
<div class="line" id="l2">ששורפים לך את הזמן</div>
<div class="line" id="l3">בתור מאמנת</div>
<div id="bar"></div>
</div>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const C=2*Math.PI*320;
function seg(t,a,d){return ease((t-a)/d)}
function pop(el,p,dy=70){el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`}
function setT(t){
  const arc=document.getElementById('arc');
  // ring draws in, then slowly "burns" away
  const draw=seg(t,0.1,0.9), burn=Math.max(0,(t-1.6)/4.2);
  const len=C*draw*(1-burn*0.82);
  arc.setAttribute('stroke-dasharray',`${len} ${C}`);
  arc.setAttribute('stroke-dashoffset',-(C*draw*burn*0.82));
  const n=document.getElementById('num');
  const pn=seg(t,0.2,0.7); n.style.opacity=pn; n.style.transform=`scale(${0.6+0.4*pn})`;
  pop(l1,seg(t,0.9,0.6)); pop(l2,seg(t,1.4,0.6)); pop(l3,seg(t,1.9,0.6));
  const b=document.getElementById('bar'); b.style.transform=`scaleX(${seg(t,2.6,0.8)})`;
  // gentle fade out of everything at the very end is avoided; hold final frame
}
const l1=document.getElementById('l1'),l2=document.getElementById('l2'),l3=document.getElementById('l3');
setT(0);
</script></body></html>
