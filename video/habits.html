<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Assistant;font-weight:800;src:url(Assistant-800.ttf)}
@font-face{font-family:Assistant;font-weight:400;src:url(Assistant-400.ttf)}
:root{--brown:#8C6249;--green:#2D4739;--ivory:#FDFBF7}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ivory)}
body{font-family:Assistant,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;contain:paint}
.blob{position:absolute;border-radius:50%;background:var(--brown);opacity:.08}
#ring{position:absolute;left:290px;top:250px}
#lab{position:absolute;top:330px;width:100%;text-align:center;font-weight:400;font-size:46px;color:var(--green);opacity:.75}
#num{position:absolute;top:385px;width:100%;text-align:center;font-weight:800;font-size:270px;line-height:1;color:var(--brown)}
#txt{position:absolute;top:800px;left:90px;width:900px;text-align:center;font-weight:800;font-size:104px;line-height:1.25;color:var(--green);text-wrap:balance}
#txt b{color:var(--brown);font-weight:800}
#dots{position:absolute;bottom:200px;width:100%;display:flex;justify-content:center;gap:28px;direction:ltr}
#dots i{width:22px;height:22px;border-radius:50%;background:var(--green);opacity:.18}
#dots i.on{opacity:1;background:var(--brown)}
</style></head><body><div id="stage">
<div class="blob" style="width:900px;height:900px;left:-300px;top:-250px"></div>
<div class="blob" style="width:700px;height:700px;right:-250px;bottom:-200px;background:var(--green);opacity:.07"></div>
<svg id="ring" width="500" height="500" viewBox="0 0 500 500">
  <circle cx="250" cy="250" r="226" fill="none" stroke="#2D4739" stroke-opacity=".12" stroke-width="12"/>
  <circle id="arc" cx="250" cy="250" r="226" fill="none" stroke="#8C6249" stroke-width="12" stroke-linecap="round" transform="rotate(-90 250 250)"/>
</svg>
<div id="lab">הרגל</div><div id="num"></div><div id="txt"></div>
<div id="dots"><i></i><i></i><i></i><i></i><i></i></div>
</div>
<script>
const H=[
 'לעדכן <b>10 מטופלות</b> במקביל שהתפנה לך מקום',
 'לרדוף אחרי <b>העברות בביט</b>',
 'לשלוח <b>תזכורות</b> למפגשים',
 'לנהל <b>רשימות המתנה</b> במחברת',
 'לנסות למצוא זמן לשתות <b>קפה</b> בין כל אלה'];
const D=2.5, C=2*Math.PI*226;
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const $=id=>document.getElementById(id);
const dots=[...document.querySelectorAll('#dots i')];
function setT(t){
  const k=Math.min(4,Math.floor(t/D)), l=t-k*D;
  if($('num').dataset.k!=k){$('num').dataset.k=k;$('num').textContent=k+1;$('txt').innerHTML=H[k];dots.forEach((d,i)=>d.classList.toggle('on',i===k));}
  const out=1-ease((l-(D-0.3))/0.3);           // fade out at end of each frame (not last)
  const o=k===4?1:out;
  const pn=ease(l/0.45), pt=ease((l-0.3)/0.5);
  $('num').style.opacity=pn*o; $('num').style.transform=`scale(${0.6+0.4*pn})`;
  $('lab').style.opacity=.75*pn*o;
  $('txt').style.opacity=pt*o; $('txt').style.transform=`translateY(${(1-pt)*60}px)`;
  const draw=ease(l/0.8), burn=Math.max(0,(l-0.8)/(D-0.8));
  $('arc').setAttribute('stroke-dasharray',`${C*draw*(1-burn*0.85)} ${C}`);
  $('arc').setAttribute('stroke-dashoffset',-(C*draw*burn*0.85));
  $('ring').style.opacity=o; $('dots').style.opacity=o>0.5?1:1;
}
setT(0);
</script></body></html>
