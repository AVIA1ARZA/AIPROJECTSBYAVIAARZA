<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Assistant;font-weight:800;src:url(Assistant-800.ttf)}
@font-face{font-family:Assistant;font-weight:400;src:url(Assistant-400.ttf)}
:root{--brown:#8C6249;--green:#2D4739;--ivory:#FDFBF7}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:2340px;overflow:hidden;background:var(--ivory)}
body{font-family:Assistant,sans-serif}
#stage{position:absolute;left:0;top:0;width:1080px;height:2340px;overflow:hidden;contain:paint}
.blob{position:absolute;border-radius:50%;background:var(--brown);opacity:.08}
#ring{position:absolute;left:340px;top:430px}
#q{position:absolute;top:1060px;left:90px;width:900px;text-align:center;font-weight:800;font-size:104px;line-height:1.28;color:var(--green);text-wrap:balance}
#q b{color:var(--brown);font-weight:800}
#sub{position:absolute;top:1700px;width:100%;text-align:center;font-weight:400;font-size:50px;color:var(--green);opacity:.75}
</style></head><body><div id="stage">
<div class="blob" style="width:900px;height:900px;left:-300px;top:-250px"></div>
<div class="blob" style="width:700px;height:700px;right:-250px;bottom:-200px;background:var(--green);opacity:.07"></div>
<!-- single-line key: a ring (the "one-time" code) with a keyhole-like dot -->
<svg id="ring" width="400" height="400" viewBox="0 0 400 400" fill="none" stroke="#8C6249" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="200" cy="200" r="170" stroke="#2D4739" stroke-opacity=".12"/>
  <circle id="arc" cx="200" cy="200" r="170" transform="rotate(-90 200 200)"/>
  <g id="key"><circle cx="150" cy="200" r="38"/><path d="M188 200H290M262 200v30M290 200v40"/></g>
</svg>
<div id="q">איך נותנים קוד <b>למתאמן אחד</b> ומוודאים שרק הוא ישתמש בו?</div>
<div id="sub">הנה איך זה עובד</div>
</div>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const $=id=>document.getElementById(id), C=2*Math.PI*170;
function setT(t){
  const d=ease((t-0.1)/0.9);
  $('arc').setAttribute('stroke-dasharray',`${C*d} ${C}`);
  const k=ease((t-0.3)/0.6); $('key').style.opacity=k; $('key').style.transform=`scale(${0.8+0.2*k})`; $('key').style.transformOrigin='200px 200px';
  const q=ease((t-0.7)/0.6); $('q').style.opacity=q; $('q').style.transform=`translateY(${(1-q)*60}px)`;
  $('sub').style.opacity=.75*ease((t-1.8)/0.6);
}
setT(0);
</script></body></html>
